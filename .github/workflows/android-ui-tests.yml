name: Android UI Tests

# targetSdk 引き上げによる edge-to-edge / WindowInsets の挙動変化は、コンパイルにも
# JVM ユニットテストにも現れない。エミュレータ上の Compose UI テストが唯一の検知手段。
# エミュレータ API は targetSdk の引き上げ先（現行 compileSdk）に合わせる。
# targetSdk / compileSdk を上げたら api-level も追随させること。
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-tests.yml'
  workflow_dispatch:

concurrency:
  group: android-ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    name: Android UI Test (API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: UI テストを実行
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # SDK 上のパッケージ名が android-37.0 のため "37.0" を指定する（platform・system image 共通）。
          # 引用符を外すと YAML が数値 37 に丸め、platforms;android-37 が見つからず失敗する。
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # 未指定だと /data が約 800MB しか無く、APK インストール時に容量不足で system_server が不安定になる。
          disk-size: 6000M
          # 既定（2 コア・2GB）では API 37 イメージの system_server が起動後に落ちて再起動を繰り返す。
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/run-ui-tests.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-test-report-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 14

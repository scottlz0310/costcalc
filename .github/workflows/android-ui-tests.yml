name: Android UI Tests

# targetSdk 引き上げによる edge-to-edge / WindowInsets の挙動変化は、コンパイルにも
# JVM ユニットテストにも現れない。エミュレータ上の Compose UI テストが唯一の検知手段。
#
# API 36 および compileSdk 先の API 37.0 の両方を必須として実行する。
# runner 付属の旧 avdmanager による API 誤認（#101）は、Command-line Tools 22.0 の導入と
# AVD target 検査で解消済み。
#
# runner-images 側で標準の Command-line Tools が 22.0 以上に更新されるまでの間、
# 週次（schedule）実行で上流の更新を自己検知し、更新が確認された段階で一時ワークアラウンドを撤去する（#127）。
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-tests.yml'
      - '.github/scripts/run-ui-tests.sh'
      - '.github/scripts/check-avd-target.sh'
      - '.github/scripts/check-runner-cmdline-tools.sh'
  schedule:
    # 毎週月曜 03:00（JST）
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: android-ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    name: Android UI Test (API ${{ matrix.api_level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # 週次実行で runner の Command-line Tools 更新を検知したとき、#127 にコメントするために必要。
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: '36'
          # SDK 上のパッケージ名が android-37.0 のため "37.0" を指定する（platform・system image 共通）。
          # 引用符を外すと YAML が数値 37 に丸められ、platforms;android-37 が見つからず失敗する。
          - api_level: '37.0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # runner 付属の旧 avdmanager は android-37.0 を android-0 と誤認する。
      # emulator-runner は latest/bin を PATH の先頭に戻すため、latest 自体を更新する。
      - name: Android Command-line Tools 22.0 を使用
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'cmdline-tools;22.0' < <(yes)
          tools="$ANDROID_HOME/cmdline-tools"
          test -x "$tools/22.0/bin/avdmanager"
          mv "$tools/latest" "$RUNNER_TEMP/android-command-line-tools-original"
          ln -s 22.0 "$tools/latest"
          mkdir -p ui-test-diagnostics
          cat "$tools/latest/source.properties" | tee ui-test-diagnostics/command-line-tools.txt
          "$tools/latest/bin/sdkmanager" --version

      - name: ランナー標準の Command-line Tools 更新を検査
        # 1 つのマトリクス実行（API 37.0）だけで検査・通知を行えば十分
        if: matrix.api_level == '37.0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: '127'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/check-runner-cmdline-tools.sh "$RUNNER_TEMP/android-command-line-tools-original/source.properties"

      # エミュレータ起動後の処理をインストールとテスト実行だけにするため、APK を先にビルドしておく。
      - name: APK をビルド
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: UI テストを実行
        id: ui-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # 未指定だと /data が約 800MB で 100% 使用となり、APK がインストールできない（実測）。
          disk-size: 6000M
          # ubuntu-latest（4 vCPU / 16GB）に合わせる。
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash .github/scripts/check-avd-target.sh 'android-${{ matrix.api_level }}' "$ANDROID_AVD_HOME/test.ini"
            bash .github/scripts/run-ui-tests.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-test-report-api-${{ matrix.api_level }}-${{ github.run_number }}
          # ui-test-diagnostics: run-ui-tests.sh が残す証跡（連続 logcat・dropbox のクラッシュ記録・
          # 試行ごとの状態と結果）。テストが走らなかった場合の原因調査に使う。
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            ui-test-diagnostics
          if-no-files-found: warn
          retention-days: 14

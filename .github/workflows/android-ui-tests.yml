name: Android UI Tests

# targetSdk 引き上げによる edge-to-edge / WindowInsets の挙動変化は、コンパイルにも
# JVM ユニットテストにも現れない。エミュレータ上の Compose UI テストが唯一の検知手段。
#
# 本来は targetSdk の引き上げ先（現行 compileSdk = API 37）で実行したいが、Linux CI の API 37 エミュレータは
# 旧 avdmanager による API 誤認で surfaceflinger 等が abort していた（#101）。
# Command-line Tools 22.0 と AVD target の確認を入れ、CI 上での安定性を検証する。
# そのため API 36 を必須、API 37 を非必須（失敗しても CI を落とさず警告のみ）で併走させる。
# API 37 が安定して緑になったら #101 の手順で必須化する。
# targetSdk 引き上げ PR は、CI の API 36 だけでは検証できないため scripts/run-ui-tests-local.ps1 で
# 手元の API 37 エミュレータでも実行し、結果を commit status として PR に残すこと（README 参照）。
#
# 週次（schedule）でも実行する。エミュレータとシステムイメージは実行時点の最新を使うため、上流の修正で
# API 37 が緑になったら #101 に通知する（必須化を判断する契機）。API 36 が週次で落ちた場合は、
# 依存更新などで main が壊れた合図になる。
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-tests.yml'
      - '.github/scripts/run-ui-tests.sh'
      - '.github/scripts/check-avd-target.sh'
  schedule:
    # 毎週月曜 03:00（JST）
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: android-ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    name: Android UI Test (API ${{ matrix.api_level }}${{ matrix.experimental && ', 非必須' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # 週次実行で API 37 が緑になったとき、#101 にコメントするために必要（PR 実行では使わない）。
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: '36'
            experimental: false
          # SDK 上のパッケージ名が android-37.0 のため "37.0" を指定する（platform・system image 共通）。
          # 引用符を外すと YAML が数値 37 に丸められ、platforms;android-37 が見つからず失敗する。
          - api_level: '37.0'
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # runner 付属の旧 avdmanager は android-37.0 を android-0 と誤認する。
      # emulator-runner は latest/bin を PATH の先頭に戻すため、latest 自体を更新する。
      - name: Android Command-line Tools 22.0 を使用
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'cmdline-tools;22.0' < <(yes)
          tools="$ANDROID_HOME/cmdline-tools"
          test -x "$tools/22.0/bin/avdmanager"
          mv "$tools/latest" "$RUNNER_TEMP/android-command-line-tools-original"
          ln -s 22.0 "$tools/latest"
          mkdir -p ui-test-diagnostics
          cat "$tools/latest/source.properties" | tee ui-test-diagnostics/command-line-tools.txt
          "$tools/latest/bin/sdkmanager" --version

      # エミュレータ起動後の処理をインストールとテスト実行だけにするため、APK を先にビルドしておく。
      - name: APK をビルド
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: UI テストを実行
        id: ui-tests
        # 非必須ジョブ（API 37）は失敗しても job を落とさない。失敗は次のステップで警告として可視化する。
        continue-on-error: ${{ matrix.experimental }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # 未指定だと /data が約 800MB で 100% 使用となり、APK がインストールできない（実測）。
          disk-size: 6000M
          # ubuntu-latest（4 vCPU / 16GB）に合わせる。
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash .github/scripts/check-avd-target.sh 'android-${{ matrix.api_level }}' "$ANDROID_AVD_HOME/test.ini"
            bash .github/scripts/run-ui-tests.sh

      - name: 非必須ジョブの失敗を警告として残す
        if: matrix.experimental && steps.ui-tests.outcome == 'failure'
        run: |
          echo "::warning title=API ${{ matrix.api_level }} の UI テストが失敗::非必須ジョブのため CI は落としていません。既知の問題で、原因と戻す条件は #101 を参照してください。診断は artifact の ui-test-diagnostics にあります。"
          {
            echo "### :warning: API ${{ matrix.api_level }} の UI テストが失敗（非必須）"
            echo ""
            echo "Linux CI の API 37 エミュレータは既知の問題で不安定です。原因と戻す条件は #101 を参照。"
            echo "このジョブが緑になったら、API 37 を必須にできるか #101 で判断してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error により、非必須ジョブはテストが失敗してもジョブ自体は成功になる。
      # 緑かどうかはジョブの結果ではなく、テストステップの outcome で判定する。
      - name: API 37 が緑になったことを #101 に通知
        if: github.event_name == 'schedule' && matrix.experimental && steps.ui-tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: '101'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify-api37-green.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-test-report-api-${{ matrix.api_level }}-${{ github.run_number }}
          # ui-test-diagnostics: run-ui-tests.sh が残す証跡（連続 logcat・dropbox のクラッシュ記録・
          # 試行ごとの状態と結果）。テストが走らなかった場合の原因調査に使う。
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            ui-test-diagnostics
          if-no-files-found: warn
          retention-days: 14

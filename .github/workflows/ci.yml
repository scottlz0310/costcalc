name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: ユニットテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: ユニットテストを実行
        run: ./gradlew test :app:createDebugUnitTestCoverageReport --no-daemon

      # カバレッジは情報提供のため、アップロードの失敗（トークン未設定・Codecov 側の障害）で CI を落とさない。
      # fork からの PR はシークレットを参照できないが、公開 repo のためトークンなしでもアップロードできる。
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14

  script-tests:
    name: シェルスクリプトのテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: シェルスクリプトのテストを実行
        run: |
          for t in .github/scripts/test/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: Android Lint を実行
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-results-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  release-optimization:
    name: Release 最適化検証
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # PR では署名シークレットを使わず、Release と同じ最適化処理を検証する。
      # 配布用の署名設定は変更せず、生成した AAB もアップロードしない。
      - name: 未署名の Release AAB をビルド
        run: |
          cat > "$RUNNER_TEMP/unsigned-release.gradle" <<'EOF'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { extension ->
                      extension.buildTypes.getByName('release').signingConfig = null
                  }
              }
          }
          EOF
          chmod +x ./gradlew
          ndk_version="$(./gradlew -q :app:printNdkVersion --no-daemon)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_version"
          ./gradlew -I "$RUNNER_TEMP/unsigned-release.gradle" :app:bundleRelease --no-daemon

      - name: 最適化メタデータと難読化マッピングを検証
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          unzip -p "$aab" BUNDLE-METADATA/com.android.tools/r8.json > "$RUNNER_TEMP/r8.json"
          jq -e '
            .options.isObfuscationEnabled == true and
            .options.isOptimizationsEnabled == true and
            .options.isShrinkingEnabled == true and
            .resourceOptimization.isOptimizedShrinkingEnabled == true and
            (.stats.noObfuscationPercentage | type == "number" and . >= 0 and . < 75) and
            (.stats.noOptimizationPercentage | type == "number" and . >= 0 and . < 75) and
            (.stats.noShrinkingPercentage | type == "number" and . >= 0 and . < 75)
          ' "$RUNNER_TEMP/r8.json"
          unzip -p "$aab" BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map > "$RUNNER_TEMP/proguard.map"
          test -s "$RUNNER_TEMP/proguard.map"
          cmp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/proguard.map"

      # prebuilt ライブラリから抽出されたシンボル表が存在する場合に、AAB 同梱と一致を検証する。
      # 配布元ですでに strip 済みのライブラリ（DataStore 1.3.0 以降や CameraX、ML Kit 等）からは
      # シンボル表が生成されないため、抽出対象が存在する場合のみ照合する。
      - name: ネイティブシンボル表の同梱を検証
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          symbols_dir="app/build/intermediates/native_symbol_tables/release/extractReleaseNativeSymbolTables/out"
          verified_count=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "$symbols_dir/$abi" ]; then
              for sym_file in "$symbols_dir/$abi"/*.sym; do
                if [ -f "$sym_file" ]; then
                  filename="$(basename "$sym_file")"
                  symbols="$RUNNER_TEMP/$abi-$filename"
                  unzip -p "$aab" "BUNDLE-METADATA/com.android.tools.build.debugsymbols/$abi/$filename" > "$symbols"
                  test -s "$symbols"
                  readelf --section-headers "$symbols" | grep -F '.symtab'
                  cmp "$sym_file" "$symbols"
                  verified_count=$((verified_count + 1))
                fi
              done
            fi
          done
          if [ "$verified_count" -gt 0 ]; then
            echo "抽出されたネイティブシンボル表 $verified_count 件を検証しました。"
          else
            echo "抽出対象のネイティブシンボル（.symtab を保持する prebuilt ライブラリ）はありませんでした。"
          fi

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 版は .ktlint-version が唯一の定義。ローカル（lefthook）も同じ scripts/ktlint.sh を使うため、版が食い違わない。
      # ktlint.sh は、必要ならインストールし、PATH ではなくインストール先のバイナリを実行する。
      - name: ktlint チェック
        env:
          # 未認証の GitHub API はレート制限が厳しいため、トークンを渡す。
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ktlint.sh "**/*.kt"

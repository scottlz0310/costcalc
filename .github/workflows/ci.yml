name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: ユニットテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: ユニットテストを実行
        run: ./gradlew test :app:createDebugUnitTestCoverageReport --no-daemon

      # カバレッジは情報提供のため、アップロードの失敗（トークン未設定・Codecov 側の障害）で CI を落とさない。
      # fork からの PR はシークレットを参照できないが、公開 repo のためトークンなしでもアップロードできる。
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14

  script-tests:
    name: シェルスクリプトのテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: シェルスクリプトのテストを実行
        run: |
          for t in .github/scripts/test/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: Android Lint を実行
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-results-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 版は .ktlint-version が唯一の定義。ローカル（lefthook）も同じスクリプトで入れるため、版が食い違わない。
      - name: ktlint をインストール
        env:
          # 未認証の GitHub API はレート制限が厳しいため、トークンを渡す。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install-ktlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ktlint チェック
        run: ktlint "**/*.kt"

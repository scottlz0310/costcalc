name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: ユニットテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: ユニットテストを実行
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: ktlint をインストール
        env:
          # renovate: datasource=github-releases depName=pinterest/ktlint
          KTLINT_VERSION: "1.8.0"
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: ktlint チェック
        run: ktlint "**/*.kt"

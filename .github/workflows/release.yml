name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    name: ユニットテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: ユニットテストを実行
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14

  build-debug:
    name: Debug APK ビルド
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: Debug APK をビルド
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: shoptools-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-release:
    name: Release APK ビルド + GitHub Release 作成
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: keystore ファイルを復元
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/release.keystore

      - name: keystore.properties を生成
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ runner.temp }}/release.keystore
          storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EOF

      - run: chmod +x ./gradlew

      - name: Release APK をビルド
        run: ./gradlew assembleRelease --no-daemon

      - name: GitHub Release を draft 作成 + APK を添付
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

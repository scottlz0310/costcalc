name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    name: ユニットテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: ユニットテストを実行
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14

  build-debug:
    name: Debug ビルド検証
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      # APK は artifact として公開しない。公式配布は Google Play のみとし、
      # インストール可能なビルドを Actions artifact に残さない方針のため
      # (dex/packaging 段階の失敗を検出する目的でビルド自体は継続する)。
      - name: Debug APK をビルド
        run: ./gradlew assembleDebug --no-daemon

  build-release:
    name: Play 用 AAB ビルド + GitHub Release 作成
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: keystore ファイルを復元
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/release.keystore

      - name: keystore.properties を生成
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ runner.temp }}/release.keystore
          storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EOF

      - run: chmod +x ./gradlew

      # Play へアップロードする成果物は AAB。この署名鍵はアップロード鍵として扱われ、
      # 利用者に届く APK は Play アプリ署名により Google の鍵で署名される。
      - name: Play 用 AAB をビルド
        run: ./gradlew bundleRelease --no-daemon

      # Play Console への手動アップロード用。GitHub Release には添付しない。
      - uses: actions/upload-artifact@v7
        with:
          name: shoptools-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # リリースノートのみ。公式配布は Google Play のため、バイナリは添付しない。
      - name: GitHub Release を draft 作成（バイナリ添付なし）
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
